name: Propose vault-template update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - standards/catalog/stix-2.1.json
      - standards/vault-template-manifest.json
      - scripts/generate-catalog.mjs

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.VAULT_SYNC_APP_ID }}
          private-key: ${{ secrets.VAULT_SYNC_PRIVATE_KEY }}
          owner: rx4747
          repositories: cti-investigation-vault
          permission-contents: write
          permission-pull-requests: write

      - name: Check out plugin catalog
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable pnpm through Corepack
        run: corepack enable pnpm

      - name: Install and generate templates
        run: |
          pnpm install --frozen-lockfile
          pnpm generate

      - name: Check out the vault repository
        uses: actions/checkout@v7
        with:
          repository: rx4747/cti-investigation-vault
          token: ${{ steps.app-token.outputs.token }}
          path: vault

      - name: Synchronize generated templates only
        run: |
          mkdir -p "vault/Templates/STIX 2.1"
          rsync --archive --delete \
            --exclude .generated-manifest.json \
            "generated/vault-template/Templates/STIX 2.1/" \
            "vault/Templates/STIX 2.1/"
          cp standards/vault-template-manifest.json vault/.cti-template-manifest.json

      - name: Open a reviewable vault pull request
        working-directory: vault
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Vault templates are already current."
            exit 0
          fi
          branch="automation/stix-templates-${GITHUB_SHA::7}"
          git config user.name "cti-vault-sync[bot]"
          git config user.email "cti-vault-sync[bot]@users.noreply.github.com"
          git switch --create "${branch}"
          git add "Templates/STIX 2.1" .cti-template-manifest.json
          git commit --message "chore: sync STIX templates"
          git push origin "HEAD:refs/heads/${branch}"
          gh pr create \
            --repo rx4747/cti-investigation-vault \
            --base main \
            --head "${branch}" \
            --title "chore: sync STIX templates" \
            --body "Generated from rx4747/cti-stix-workbench@${GITHUB_SHA}. This updates only the public template tree and manifest; local .obsidian state is not included."
