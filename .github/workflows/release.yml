name: Release Obsidian plugin

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable pnpm through Corepack
        run: corepack enable pnpm

      - name: Resolve release version
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
              echo "Manual releases must run from the default branch (${DEFAULT_BRANCH})." >&2
              exit 1
            fi
            release_tag="$(node -p "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')).version")"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/check-release-version.mjs

      - name: Extract release notes
        run: node scripts/extract-release-notes.mjs "${{ steps.release.outputs.tag }}" release-notes.md

      - name: Reject an existing draft or release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set +e
          api_error="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>&1 >/dev/null)"
          api_status=$?
          set -e
          if [[ ${api_status} -eq 0 ]]; then
            echo "A GitHub release already exists for ${RELEASE_TAG}." >&2
            exit 1
          fi
          if [[ "${api_error}" != *"HTTP 404"* ]]; then
            echo "${api_error}" >&2
            exit "${api_status}"
          fi

      - name: Reject an existing tag for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null
          tag_status=$?
          set -e
          case "${tag_status}" in
            0)
              echo "Release tag ${RELEASE_TAG} already exists." >&2
              exit 1
              ;;
            2)
              ;;
            *)
              echo "Could not check whether ${RELEASE_TAG} exists." >&2
              exit "${tag_status}"
              ;;
          esac

      - name: Verify pushed tag provenance
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = "tag"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")" = "${GITHUB_SHA}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned standards
        run: pnpm verify:sources

      - name: Verify generated catalog and coverage
        run: pnpm check:generated

      - name: Check documentation links
        run: pnpm check:docs

      - name: Check runtime security boundary
        run: pnpm check:security

      - name: Test
        run: pnpm test

      - name: Marketplace lint (zero warnings)
        run: pnpm lint:marketplace

      - name: Typecheck
        run: pnpm typecheck

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Build production bundle
        run: pnpm build

      - name: Smoke test production bundle
        run: pnpm smoke

      - name: Build and verify release assets
        run: pnpm check:release

      - name: Create and push annotated release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${RELEASE_TAG}" --message "Release ${RELEASE_TAG}" "${GITHUB_SHA}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = "tag"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/release/cti-stix-workbench-${{ steps.release.outputs.tag }}/main.js
            dist/release/cti-stix-workbench-${{ steps.release.outputs.tag }}/manifest.json
            dist/release/cti-stix-workbench-${{ steps.release.outputs.tag }}/styles.css

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          release_dir="dist/release/cti-stix-workbench-${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" \
            "${release_dir}/main.js" \
            "${release_dir}/manifest.json" \
            "${release_dir}/styles.css" \
            --draft \
            --latest=false \
            --notes-file release-notes.md \
            --title "${RELEASE_TAG}" \
            --verify-tag
