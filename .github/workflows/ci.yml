name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable pnpm through Corepack
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check commit messages
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        env:
          COMMIT_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COMMIT_TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git cat-file -e "${COMMIT_FROM}^{commit}" 2>/dev/null; then
            COMMIT_FROM="$(git merge-base "origin/${DEFAULT_BRANCH}" "${COMMIT_TO}")"
          fi
          pnpm exec commitlint --from "${COMMIT_FROM}" --to "${COMMIT_TO}" --verbose

      - name: Check formatting and baseline lint
        run: pnpm format:check

      - name: Verify pinned standards
        run: pnpm verify:sources

      - name: Verify generated catalog and coverage
        run: pnpm check:generated

      - name: Check documentation links
        run: pnpm check:docs

      - name: Check runtime security boundary
        run: pnpm check:security

      - name: Test
        run: pnpm test

      - name: Marketplace lint (zero warnings)
        run: pnpm lint:marketplace

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Smoke test production bundle
        run: pnpm smoke

      - name: Verify release artifacts
        run: pnpm check:release

      - name: Audit dependencies
        run: pnpm audit --audit-level high
