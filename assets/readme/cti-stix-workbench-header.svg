    <circle cx="1230" cy="116" r="10" fill="#a78bfa" />
    <circle cx="1386" cy="202" r="13" fill="#38bdf8" />
    <circle cx="1272" cy="338" r="10" fill="#8b5cf6" />
    <circle cx="1490" cy="118" r="9" fill="#a78bfa" />
    <circle cx="1496" cy="318" r="9" fill="#38bdf8" />
  </g>

