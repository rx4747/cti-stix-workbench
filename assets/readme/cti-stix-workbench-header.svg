<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title description">
  <title id="title">CTI STIX Workbench</title>
  <desc id="description">Obsidian plugin for local STIX 2.1 intelligence analysis</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0b1e" />
      <stop offset="0.52" stop-color="#21143e" />
      <stop offset="1" stop-color="#101b33" />
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4a7ff" />
      <stop offset="0.5" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035" />
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
  </defs>

  <rect width="1600" height="480" rx="34" fill="url(#background)" />
  <rect width="1600" height="480" rx="34" fill="url(#grid)" />
  <circle cx="230" cy="240" r="152" fill="#8b5cf6" opacity="0.16" filter="url(#glow)" />
  <circle cx="1390" cy="90" r="180" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <g stroke-linecap="round">
